[build-system]
requires = []
build-backend = "adevv._build"
backend-path = ["."]

[project]
name = "adevv"
version = "1.3.0"
description = "Herramienta global para desarrollo orquestado multi-arnés"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nereo Skills Team" }
]

[project.scripts]
adevv = "adevv.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]